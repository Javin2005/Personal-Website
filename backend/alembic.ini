# Alembic = the tool that changes the structure of the live database
# (new tables, new columns) without losing the data in it.
# Usage (from the backend folder):
#   poetry run alembic upgrade head      apply all migrations
#   poetry run alembic revision -m "x"   create a new, empty migration file
# The app also runs "upgrade head" by itself when it starts (see main.py).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
